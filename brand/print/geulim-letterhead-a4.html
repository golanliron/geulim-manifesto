<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>דף מכתבים בית ספר גאולים</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700;900&family=Frank+Ruhl+Libre:wght@400;700;900&family=Noto+Serif+Hebrew:wght@700;900&display=swap" rel="stylesheet">
<style>
@page{ size:A4; margin:0; }
*{ box-sizing:border-box; }

:root{
  --navy:#1F355E;
  --navy-deep:#14243F;
  --rust:#C4622D;
  --olive:#8A9746;
  --olive-2:#949E5C;
  --sun:#F0C357;
  --sand:#D8C7A0;
  --sand-2:#C9B88C;
  --paper:#F8F6F1;
  --paper-2:#F4EDDC;
  --water:#4A7398;
  --ink:#1F355E;
  --ink-soft:#69707C;
  --ink-mute:#9297A1;
}

body{
  margin:0;
  font-family:"Heebo",sans-serif;
  background:#dcd9d0;
  color:var(--ink);
  -webkit-print-color-adjust:exact;
  print-color-adjust:exact;
}

.page{
  width:210mm; height:297mm;
  position:relative;
  background:var(--paper);
  overflow:hidden;
  margin:0 auto;
}

/* ---------- קשת הפסיפס בפינה ---------- */
.arch{
  position:absolute;
  top:-30mm; left:-30mm;
  width:88mm; height:88mm;
  z-index:1;
}
.arch svg{ width:100%; height:100%; display:block; }

/* ---------- ראש הדף ---------- */
.head{
  position:relative;
  z-index:3;
  display:flex;
  justify-content:flex-start;
  padding:13mm 18mm 0;
}
.school-logo{ height:36mm; width:auto; }

/* ---------- גוף המכתב ---------- */
.body-area{
  position:relative; z-index:3;
  padding:12mm 18mm 0;
}

.meta{
  display:flex; justify-content:space-between;
  font-size:9.5pt; color:var(--ink-soft);
  padding-bottom:4mm;
  border-bottom:0.4mm solid rgba(31,53,94,.12);
  margin-bottom:11mm;
}
.fill{
  display:inline-block; min-width:34mm;
  border-bottom:0.35mm dotted var(--sand-2);
}

.lines{ display:grid; gap:8.6mm; }
.lines span{ display:block; height:0.25mm; background:rgba(31,53,94,.075); }

/* ---------- איור הרחוב ---------- */
.cityline{
  position:absolute;
  right:0; left:0; bottom:22mm;
  z-index:2;
  line-height:0;
}
.cityline img{
  width:100%;
  height:auto;
  display:block;
}

/* ---------- כותרת תחתונה ---------- */
.footer{
  position:absolute; right:0; left:0; bottom:9mm;
  z-index:3;
  text-align:center;
  color:var(--navy);
  font-size:9.5pt;
  line-height:1.75;
}
.footer .line2{ direction:rtl; unicode-bidi:plaintext; }

@media print{ body{ background:#fff; } }
</style>
</head>
<body>
<main class="page">

  <div class="arch" aria-hidden="true">
    <svg viewBox="0 0 400 400" fill="none"><g id="archTiles"></g></svg>
  </div>

  <header class="head">
    <img class="school-logo" src="../assets/logo/geulim-logo-slogan-transparent.png" alt="בית הספר גאולים ע&quot;ש יצחק נבון">
  </header>

  <section class="body-area">
    <div class="meta">
      <span>לכבוד: <i class="fill"></i></span>
      <span>תאריך: <i class="fill" style="min-width:26mm"></i></span>
    </div>
    <div class="lines" aria-hidden="true">
      <span></span><span></span><span></span><span></span><span></span>
      <span></span><span></span><span></span><span></span><span></span>
      <span></span><span></span><span></span><span></span><span></span>
      <span></span><span></span><span></span><span></span>
    </div>
  </section>

  <!-- איור הרחוב של גאולי (בקעה) -->
  <div class="cityline" aria-hidden="true">
    <img src="../cityline-transparent.png" alt="">
  </div>

  <footer class="footer">
    <div class="line1">בית הספר הממלכתי גאולים &nbsp;|&nbsp; רחוב קיבוץ גלויות 4 ירושלים &nbsp;|&nbsp; 93625</div>
    <div class="line2">טל: 02-6733879 &nbsp;|&nbsp; פקס: 02-6738639 &nbsp;|&nbsp; geulim.jerusalem@gmail.com</div>
  </footer>
</main>

<script>
var COLS = ['#1F355E','#D8C7A0','#8A9746','#4A7398','#C4622D','#E8DEC8','#2B4470'];

/* קשת הפסיפס בפינה הימנית העליונה, שתי שורות אבנים */
(function(){
  var g=document.getElementById('archTiles');
  var NS='http://www.w3.org/2000/svg';
  var cx=340, cy=60;                 /* מרכז הקשת מחוץ לפינה */
  var rings=[[250,15,26],[292,17,27]];
  rings.forEach(function(cfg,ring){
    var R=cfg[0], n=cfg[1], w=cfg[2];
    for(var i=0;i<n;i++){
      var a0=(Math.PI/2)*(i/(n-1)) + Math.PI/2;   /* משמאל כלפי מטה */
      var x=cx+R*Math.cos(a0), y=cy+R*Math.sin(a0);
      var r=document.createElementNS(NS,'rect');
      r.setAttribute('x',(-w/2).toFixed(1));
      r.setAttribute('y',(-w/2).toFixed(1));
      r.setAttribute('width',(w*0.80).toFixed(1));
      r.setAttribute('height',(w*0.80).toFixed(1));
      r.setAttribute('rx','3');
      r.setAttribute('fill',COLS[(i+ring*3)%COLS.length]);
      r.setAttribute('opacity',(0.80+((i*7)%13)/70).toFixed(2));
      r.setAttribute('transform','translate('+x.toFixed(1)+' '+y.toFixed(1)+') rotate('+(a0*180/Math.PI+90).toFixed(1)+')');
      g.appendChild(r);
    }
  });
})();
</script>
</body>
</html>
