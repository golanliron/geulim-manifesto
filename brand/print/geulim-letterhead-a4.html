<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>דף מכתבים בית ספר גאולים</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700;900&family=Frank+Ruhl+Libre:wght@400;700;900&family=Noto+Serif+Hebrew:wght@700;900&display=swap" rel="stylesheet">
<style>
@page{ size:A4; margin:0; }
*{ box-sizing:border-box; }

:root{
  --navy:#1F355E;
  --navy-deep:#14243F;
  --rust:#C4622D;
  --olive:#8A9746;
  --olive-2:#949E5C;
  --sun:#F0C357;
  --sand:#D8C7A0;
  --sand-2:#C9B88C;
  --paper:#F8F6F1;
  --paper-2:#F4EDDC;
  --water:#4A7398;
  --ink:#1F355E;
  --ink-soft:#69707C;
  --ink-mute:#9297A1;
}

body{
  margin:0;
  font-family:"Heebo",sans-serif;
  background:#dcd9d0;
  color:var(--ink);
  -webkit-print-color-adjust:exact;
  print-color-adjust:exact;
}

.page{
  width:210mm; height:297mm;
  position:relative;
  background:var(--paper);
  overflow:hidden;
  margin:0 auto;
}

/* ---------- פס הפסיפס העליון והתחתון ---------- */
.strip{
  position:absolute; right:0; left:0;
  height:5mm;
  display:flex;
  z-index:4;
}
.strip.top{ top:0; }
.strip.bottom{ bottom:0; }
.strip i{
  flex:1 1 auto;
  margin:0 0.5mm;
  border-radius:0.8mm;
  display:block;
}

/* ---------- ראש הדף ---------- */
.head{
  position:relative;
  z-index:3;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8mm;
  padding:15mm 18mm 0;
}

.school-logo{ height:24mm; width:auto; flex:0 0 auto; }

.geuli-block{ text-align:left; }

.geuli-name{
  font-family:"Noto Serif Hebrew","Frank Ruhl Libre",serif;
  font-size:23pt; font-weight:900;
  line-height:1; letter-spacing:.02em;
  color:var(--navy);
  margin:0;
}

/* הקו עם העלה, כמו בבאנר */
.leaf-rule{
  display:flex; align-items:center; gap:2mm;
  margin:2.2mm 0 2mm;
}
.leaf-rule .ln{ height:0.4mm; width:16mm; background:var(--olive); opacity:.55; }
.leaf-rule svg{ width:4.6mm; height:4.6mm; flex:0 0 auto; }

.geuli-desc{
  font-size:9.5pt; font-weight:700;
  color:var(--navy); margin:0;
}
.geuli-tag{
  font-size:8pt; color:var(--ink-mute);
  letter-spacing:.06em; margin:1.2mm 0 0;
}

/* ---------- גוף המכתב ---------- */
.body-area{
  position:relative; z-index:3;
  padding:12mm 18mm 0;
}

.meta{
  display:flex; justify-content:space-between;
  font-size:9.5pt; color:var(--ink-soft);
  padding-bottom:4mm;
  border-bottom:0.4mm solid rgba(31,53,94,.12);
  margin-bottom:11mm;
}
.fill{
  display:inline-block; min-width:34mm;
  border-bottom:0.35mm dotted var(--sand-2);
}

.lines{ display:grid; gap:8.6mm; }
.lines span{ display:block; height:0.25mm; background:rgba(31,53,94,.075); }

/* ---------- איור הרחוב ---------- */
.cityline{
  position:absolute;
  right:0; left:0; bottom:22mm;
  z-index:2;
  line-height:0;
}
.cityline img{
  width:100%;
  height:auto;
  display:block;
}

/* ---------- כותרת תחתונה ---------- */
.footer{
  position:absolute; right:0; left:0; bottom:11mm;
  z-index:3;
  background:transparent;
  color:var(--ink-soft);
  border-top:0.4mm solid rgba(138,151,70,.42);
  padding:3.5mm 18mm 0;
  display:flex; align-items:center; justify-content:space-between;
  gap:8mm;
  font-size:9pt;
  min-height:10mm;
}
.footer .contact{ display:flex; align-items:center; gap:4mm; flex-wrap:wrap; }
.footer .contact span{ white-space:nowrap; }
.footer .sep{ color:var(--olive); opacity:.8; }
.footer .site{ font-weight:700; letter-spacing:.02em; white-space:nowrap; color:var(--olive); }
.footer .fill{ border-bottom-color:var(--sand-2); }

@media print{ body{ background:#fff; } }
</style>
</head>
<body>
<main class="page">

  <div class="strip top" id="stripTop" aria-hidden="true"></div>

  <header class="head">
    <img class="school-logo" src="../assets/logo/geulim-navon-poster-transparent.png" alt="בית הספר גאולים ע&quot;ש יצחק נבון">

    <div class="geuli-block">
      <p class="geuli-name">גְּאוּלִי</p>
      <div class="leaf-rule" aria-hidden="true">
        <i class="ln"></i>
        <svg viewBox="0 0 24 24" fill="none">
          <path d="M12 21V11" stroke="#7A8545" stroke-width="1.8" stroke-linecap="round"/>
          <path d="M12 14C9 13 5 11 5 7c4 1 7 3 7 7z" fill="#7A8545"/>
          <path d="M12 13c3-1 7-3 7-7-4 1-7 3-7 7z" fill="#949E5C"/>
        </svg>
        <i class="ln"></i>
      </div>
      <p class="geuli-desc">קהילת ההורים של בית ספר גאולים</p>
      <p class="geuli-tag">מקום · אנשים · משמעות</p>
    </div>
  </header>

  <section class="body-area">
    <div class="meta">
      <span>לכבוד: <i class="fill"></i></span>
      <span>תאריך: <i class="fill" style="min-width:26mm"></i></span>
    </div>
    <div class="lines" aria-hidden="true">
      <span></span><span></span><span></span><span></span><span></span>
      <span></span><span></span><span></span><span></span><span></span>
      <span></span><span></span><span></span><span></span><span></span>
      <span></span><span></span><span></span><span></span>
    </div>
  </section>

  <!-- איור הרחוב של גאולי (בקעה) -->
  <div class="cityline" aria-hidden="true">
    <img src="../cityline-transparent.png" alt="">
  </div>

  <footer class="footer">
    <div class="contact">
      <span>בית ספר גאולים ע&quot;ש יצחק נבון</span>
      <span class="sep">·</span>
      <span>כתובת: <i class="fill" style="min-width:30mm"></i></span>
      <span class="sep">·</span>
      <span>מזכירות: <i class="fill" style="min-width:24mm"></i></span>
    </div>
    <div class="site">geuli.co.il</div>
  </footer>
</main>

<script>
var COLS = ['#1F3A5F','#E3D5B4','#7A8545','#F0C357','#C4622D','#D6C49C','#4A7398'];

/* פסי הפסיפס למעלה ולמטה */
(function(){
  var top = document.getElementById('stripTop');
  for(var i=0;i<46;i++){
    var b=document.createElement('i');
    b.style.background = COLS[(i*3+1)%COLS.length];
    top.appendChild(b);
  }
  var bot=document.createElement('div');
  bot.className='strip bottom';
  for(var j=0;j<46;j++){
    var c=document.createElement('i');
    c.style.background = COLS[(j*3+4)%COLS.length];
    bot.appendChild(c);
  }
  document.querySelector('.page').appendChild(bot);
})();

</script>
</body>
</html>
