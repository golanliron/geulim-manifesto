<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>תודה שהצטרפתם לגאולי בעסקים</title>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700;900&family=Frank+Ruhl+Libre:wght@700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --navy: #1f355e;
            --green: #8a9746;
            --sand: #d8c7a0;
            --paper: #f8f6f1;
            --muted: #657081;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            font-family: "Heebo", Arial, sans-serif;
            color: var(--navy);
            background:
                radial-gradient(circle at 20% 20%, rgba(216,199,160,.2), transparent 24%),
                radial-gradient(circle at 80% 70%, rgba(138,151,70,.12), transparent 25%),
                linear-gradient(145deg, #fff, var(--paper));
        }

        .card {
            width: min(760px, 100%);
            text-align: center;
            padding: 52px 34px 44px;
            border-radius: 30px;
            border: 1px solid rgba(216, 199, 160, .55);
            background: rgba(255,255,255,.82);
            box-shadow: 0 24px 72px rgba(31, 53, 94, .09);
        }

        img {
            width: 240px;
            max-width: 78%;
            display: block;
            margin: 0 auto 26px;
        }

        h1 {
            margin: 0 0 12px;
            font-family: "Frank Ruhl Libre", "Noto Serif Hebrew", serif;
            font-size: clamp(44px, 7vw, 78px);
            line-height: 1;
        }

        p {
            margin: 0 auto 28px;
            max-width: 560px;
            color: var(--muted);
            font-size: 22px;
            line-height: 1.7;
        }

        .dots {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 24px 0 30px;
        }

        .dot { width: 14px; height: 14px; border-radius: 50%; }
        .dot:nth-child(1) { background: var(--navy); }
        .dot:nth-child(2) { background: var(--green); }
        .dot:nth-child(3) { background: var(--sand); }

        .actions {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }

        a {
            display: inline-block;
            padding: 13px 24px;
            border-radius: 999px;
            text-decoration: none;
            font-weight: 900;
        }

        .primary { background: var(--sand); color: var(--navy); }
        .secondary { background: rgba(31,53,94,.08); color: var(--navy); }
    </style>
</head>
<body>
    <main class="card">
        <img src="brand/assets/logo/geuli-logo-and-slogan.png" alt="גאולי">
        <h1>תודה שהצטרפתם</h1>
        <p>הפרטים נשלחו למדריך העסקים הקהילתי של גאולי. אחרי השמירה הם יופיעו בעמוד גאולי בעסקים.</p>
        <div class="dots" aria-hidden="true">
            <span class="dot"></span>
            <span class="dot"></span>
            <span class="dot"></span>
        </div>
        <div class="actions">
            <a class="primary" href="index.html#businesses">לעמוד גאולי בעסקים</a>
            <a class="secondary" href="business-register.html">רישום עסק נוסף</a>
        </div>
    </main>
</body>
</html>
